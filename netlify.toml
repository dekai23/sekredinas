# Konfigurasi deploy Netlify untuk BKPSDM Yahukimo (Next.js App Router).
#
# Catatan penting:
#  - Netlify bersifat serverless, sehingga PGlite (database berbasis disk)
#    TIDAK dapat dipakai. Wajib memakai PostgreSQL cloud.
#  - Cara termudah: aktifkan "Netlify DB" (Neon) pada situs ini. Netlify akan
#    mengisi variabel NETLIFY_DATABASE_URL secara otomatis, dan aplikasi
#    sudah membacanya (lihat lib/db/index.ts).
#  - Isi juga variabel: AUTH_SECRET (min. 32 karakter) dan NEXT_PUBLIC_APP_URL.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Node 22 dipakai karena Next.js 16 memerlukan Node.js versi baru.
#
# Runtime Next.js (OpenNext) dipasang otomatis oleh Netlify saat framework
# terdeteksi dari repositori Git. Karena itu plugin sengaja TIDAK di-pin di
# sini: men-deploy lewat situs yang dibuat dari drag-and-drop membuat deteksi
# framework gagal (`framework: null`), sehingga runtime tidak terpasang.
# Solusi: impor repositori ini lewat "Add new site -> Import from Git".
